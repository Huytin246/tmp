<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Món Quà Tình Yêu - Dành Tặng Người Tôi Yêu</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================================================
           RESET & BASIC STYLES
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        :root {
            --primary-pink: #ff758c;
            --deep-red: #ff7eb3;
            --velvet-red: #d63447;
            --soft-white: #fff5f6;
            --gold-accent: #f7d070;
            --font-serif: 'Dancing Script', cursive;
            --font-sans: 'Montserrat', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-sans);
            background: linear-gradient(135deg, #2b1055, #7597de);
            color: #fff;
        }

        /* Canvas Particle Background */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Container & Screen Layouts */
        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
        }

        /* ==========================================================================
           MUSIC PLAYER (FLOATING DISC)
           ========================================================================== */
        .music-player {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 8px 16px 8px 8px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .music-disc {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, #111, #333);
            border: 2px solid var(--gold-accent);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotateDisc 4s linear infinite;
            animation-play-state: paused;
        }

        .music-disc.playing {
            animation-play-state: running;
        }

        .music-disc i {
            color: var(--gold-accent);
            font-size: 16px;
        }

        @keyframes rotateDisc {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .music-info {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* Config / Customizer Floating Button */
        .config-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .config-btn:hover {
            transform: rotate(45deg) scale(1.1);
        }

        /* ==========================================================================
           SCREEN 1: INTRO SCREEN
           ========================================================================== */
        #screen1 {
            background: linear-gradient(135deg, rgba(255, 117, 140, 0.8), rgba(255, 126, 179, 0.8));
            text-align: center;
        }

        .intro-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            animation: fadeIn 1.2s ease;
        }

        .avatar-box {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(45deg, var(--gold-accent), #fff);
            box-shadow: 0 8px 20px rgba(214, 52, 71, 0.4);
            position: relative;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .typing-text {
            font-family: var(--font-serif);
            font-size: 2rem;
            color: #fff;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            line-height: 1.3;
        }

        .btn-heartbeat {
            padding: 16px 36px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #d63447;
            background: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: heartbeat 1.5s infinite;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .btn-heartbeat:hover {
            transform: scale(1.05);
            background: #fff5f6;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }

        /* ==========================================================================
           SCREEN 2: BOUQUET INTERACTION
           ========================================================================== */
        #screen2 {
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            text-align: center;
        }

        .bouquet-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .bouquet-svg {
            width: 260px;
            height: 320px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.2));
            transition: transform 0.2s ease;
        }

        .bouquet-wrapper:active .bouquet-svg {
            transform: scale(0.96);
        }

        .hold-instruction {
            margin-top: 25px;
            font-size: 1rem;
            color: #6a1b29;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Hold Progress Ring */
        .progress-ring-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            width: 300px;
            height: 300px;
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            stroke-dasharray: 816; /* 2 * PI * 130 */
            stroke-dashoffset: 816;
        }

        /* Photo Popups */
        .popup-photo {
            position: fixed;
            width: 110px;
            height: 140px;
            background: #fff;
            padding: 8px 8px 25px 8px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            pointer-events: none;
            animation: popupFloat 1.8s ease-out forwards;
            z-index: 50;
        }

        .popup-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        @keyframes popupFloat {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
            }
            30% {
                opacity: 1;
                transform: translate(-50%, -120px) scale(1) rotate(var(--rot));
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -200px) scale(0.8) rotate(var(--rot));
            }
        }

        /* ==========================================================================
           SCREEN 3: MEMORY WATERFALL & COUNTER
           ========================================================================== */
        #screen3 {
            background: linear-gradient(135deg, #2b0826, #591d3e, #1a0826);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 80px;
            padding-bottom: 40px;
        }

        .timer-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            width: 90%;
            max-width: 500px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .timer-title {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--gold-accent);
            margin-bottom: 12px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .timer-unit {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 5px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .timer-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            display: block;
        }

        .timer-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* Waterfall Cards Container */
        .waterfall-container {
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .memory-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .memory-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .memory-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .memory-card p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #fff;
            font-weight: 300;
        }

        .memory-card .card-date {
            font-size: 0.75rem;
            color: var(--gold-accent);
            margin-top: 8px;
            text-align: right;
            font-weight: 600;
        }

        /* ==========================================================================
           CONFIG MODAL
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-body {
            background: #2b1055;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .modal-body h3 {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--gold-accent);
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: rgba(255,255,255,0.8);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .form-group textarea {
            resize: vertical;
            height: 70px;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-modal {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-save { background: var(--primary-pink); color: #fff; }
        .btn-copy { background: var(--gold-accent); color: #333; }
        .btn-close { background: rgba(255,255,255,0.2); color: #fff; }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.9rem;
            z-index: 300;
            transition: transform 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <!-- Particle Background -->
    <canvas id="bgCanvas"></canvas>

    <!-- Floating Audio Control -->
    <div class="music-player" id="musicBtn">
        <div class="music-disc" id="musicDisc">
            <i class="fa-solid font-awesome fa-music"></i>
        </div>
        <span class="music-info" id="musicStatus">Nhạc Nền</span>
    </div>

    <!-- Floating Config Button -->
    <div class="config-btn" id="openConfigBtn" title="Cấu hình tùy chỉnh">
        <i class="fa-solid fa-gear"></i>
    </div>

    <!-- Main Container -->
    <div class="app-container">

        <!-- SCREEN 1: INTRO -->
        <section class="screen active" id="screen1">
            <div class="intro-card">
                <div class="avatar-box">
                    <img id="introAvatar" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400&auto=format&fit=crop&q=80" alt="Avatar">
                </div>
                <div class="typing-text" id="typingText"></div>
                <button class="btn-heartbeat" id="startBtn">
                    <i class="fa-solid fa-heart"></i> Mở Món Quà
                </button>
            </div>
        </section>

        <!-- SCREEN 2: BOUQUET INTERACTION -->
        <section class="screen" id="screen2">
            <div class="bouquet-wrapper" id="bouquetContainer">
                <svg class="bouquet-svg" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Ribbon/Wrapper -->
                    <path d="M60 160 L100 230 L140 160 Q100 180 60 160 Z" fill="#ff758c" />
                    <path d="M50 120 Q100 150 150 120 L135 170 Q100 185 65 170 Z" fill="#ff7eb3" opacity="0.9" />
                    <path d="M90 175 C80 175, 75 190, 100 195 C125 190, 120 175, 110 175 Z" fill="#d63447" />
                    <!-- Flowers/Roses -->
                    <circle cx="100" cy="80" r="30" fill="#d63447" />
                    <circle cx="100" cy="80" r="22" fill="#ff2e63" />
                    <circle cx="100" cy="80" r="14" fill="#ff758c" />
                    
                    <circle cx="65" cy="100" r="25" fill="#e84545" />
                    <circle cx="65" cy="100" r="17" fill="#ff4b5c" />
                    
                    <circle cx="135" cy="100" r="25" fill="#e84545" />
                    <circle cx="135" cy="100" r="17" fill="#ff4b5c" />

                    <circle cx="75" cy="60" r="22" fill="#ff2e63" />
                    <circle cx="125" cy="60" r="22" fill="#ff2e63" />
                    
                    <!-- Leaves -->
                    <path d="M40 90 Q30 60 55 70 Q50 85 40 90 Z" fill="#2b580c" />
                    <path d="M160 90 Q170 60 145 70 Q150 85 160 90 Z" fill="#2b580c" />
                    <!-- Sparkles/Dots -->
                    <circle cx="100" cy="40" r="3" fill="#fff" opacity="0.8" />
                    <circle cx="50" cy="120" r="4" fill="#f7d070" opacity="0.8" />
                    <circle cx="150" cy="120" r="4" fill="#f7d070" opacity="0.8" />
                </svg>

                <div class="progress-ring-container">
                    <svg width="300" height="300">
                        <circle class="progress-ring__circle" stroke="#f7d070" stroke-width="6" fill="transparent" r="130" cx="150" cy="150"/>
                    </svg>
                </div>

                <div class="hold-instruction" id="holdInstruction">
                    <i class="fa-solid fa-hand-pointer"></i> Chạm nhẹ để bắn ảnh hoặc <b>Ấn & Giữ</b> bó hoa
                </div>
            </div>
        </section>

        <!-- SCREEN 3: MEMORY WATERFALL -->
        <section class="screen" id="screen3">
            <!-- Love Counter -->
            <div class="timer-card">
                <div class="timer-title" id="counterTitle">Bên Nhau Được</div>
                <div class="timer-grid">
                    <div class="timer-unit">
                        <span class="timer-number" id="days">00</span>
                        <span class="timer-label">Ngày</span>
                    </div>
                    <div class="timer-unit">
                        <span class="timer-number" id="hours">00</span>
                        <span class="timer-label">Giờ</span>
                    </div>
                    <div class="timer-unit">
                        <span class="timer-number" id="minutes">00</span>
                        <span class="timer-label">Phút</span>
                    </div>
                    <div class="timer-unit">
                        <span class="timer-number" id="seconds">00</span>
                        <span class="timer-label">Giây</span>
                    </div>
                </div>
            </div>

            <!-- Memories Stream -->
            <div class="waterfall-container" id="waterfallContainer">
                <!-- Dynamically populated -->
            </div>
        </section>

    </div>

    <!-- CONFIGURATION MODAL -->
    <div class="modal-overlay" id="configModal">
        <div class="modal-body">
            <h3>Cá Nhân Hóa Web</h3>
            <div class="form-group">
                <label>Tên Người Nhận (VD: Em Yêu):</label>
                <input type="text" id="cfgReceiver" placeholder="Tên người nhận">
            </div>
            <div class="form-group">
                <label>Lời Chúc Mở Đầu:</label>
                <textarea id="cfgIntroText" placeholder="Nhập lời chúc..."></textarea>
            </div>
            <div class="form-group">
                <label>Ngày Bắt Đầu Yêu (YYYY-MM-DD):</label>
                <input type="date" id="cfgStartDate">
            </div>
            <div class="form-group">
                <label>Link Nhạc Nền (MP3):</label>
                <input type="text" id="cfgMusicUrl" placeholder="https://...">
            </div>
            <div class="modal-btns">
                <button class="btn-modal btn-save" id="btnSaveConfig">Áp Dụng</button>
                <button class="btn-modal btn-copy" id="btnCopyLink">Copy Link Chia Sẻ</button>
                <button class="btn-modal btn-close" id="btnCloseConfig">Đóng</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">Đã sao chép đường dẫn chia sẻ!</div>

    <!-- HTML5 Audio Element -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112199.mp3" type="audio/mpeg">
    </audio>

    <!-- ==========================================================================
       JAVASCRIPT LOGIC
       ========================================================================== -->
    <script>
        /* --------------------------------------------------------------------------
         * CONFIGURATION & STATE MANAGEMENT
         * -------------------------------------------------------------------------- */
        const DEFAULT_CONFIG = {
            receiverName: "Công Chúa Của Anh",
            introMessage: "Chúc Em Yêu một ngày tràn ngập niềm vui, hạnh phúc và luôn mỉm cười nhé! ❤️",
            startDate: "2023-02-14",
            musicUrl: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112199.mp3",
            avatarUrl: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400&auto=format&fit=crop&q=80",
            memories: [
                {
                    img: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=600&auto=format&fit=crop&q=80",
                    text: "Lần đầu tiên chúng mình gặp nhau, nụ cười của em đã làm anh xao xuyến mãi.",
                    date: "14/02/2023"
                },
                {
                    img: "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=600&auto=format&fit=crop&q=80",
                    text: "Những chuyến đi cùng nhau là những kỷ niệm đẹp nhất mà anh luôn nâng niu.",
                    date: "20/10/2023"
                },
                {
                    img: "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=600&auto=format&fit=crop&q=80",
                    text: "Cảm ơn em đã luôn ở bên cạnh, lắng nghe và đồng hành cùng anh qua mọi khoảnh khắc.",
                    date: "25/12/2023"
                },
                {
                    img: "https://images.unsplash.com/photo-1494774157365-9e04c6720e47?w=600&auto=format&fit=crop&q=80",
                    text: "Yêu em nhiều hơn mỗi ngày. Mong rằng tương lai của chúng mình sẽ luôn ngập tràn ánh nắng!",
                    date: "Mãi mãi bên nhau"
                }
            ]
        };

        let config = { ...DEFAULT_CONFIG };

        // Parse Config from URL Parameter if exists
        function loadConfigFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');
            if (dataParam) {
                try {
                    const decoded = JSON.parse(decodeURIComponent(atob(dataParam)));
                    config = { ...config, ...decoded };
                } catch (e) {
                    console.error("Lỗi parse URL config:", e);
                }
            }
        }

        /* --------------------------------------------------------------------------
         * CANVAS PARTICLES SYSTEM (Floating Hearts & Petals)
         * -------------------------------------------------------------------------- */
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 20;
                this.size = Math.random() * 12 + 8;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.7 + 0.3;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.02;
                this.type = Math.random() > 0.4 ? 'heart' : 'petal';
                this.color = ['#ff758c', '#ff7eb3', '#d63447', '#f7d070'][Math.floor(Math.random() * 4)];
            }

            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.y * 0.01) + this.speedX;
                this.rotation += this.rotSpeed;

                if (this.y < -30) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;

                if (this.type === 'heart') {
                    // Draw Heart
                    ctx.beginPath();
                    const topCurveHeight = this.size * 0.3;
                    ctx.moveTo(0, topCurveHeight);
                    ctx.bezierCurveTo(0, 0, -this.size / 2, 0, -this.size / 2, topCurveHeight);
                    ctx.bezierCurveTo(-this.size / 2, (this.size + topCurveHeight) / 2, 0, this.size, 0, this.size);
                    ctx.bezierCurveTo(0, this.size, this.size / 2, (this.size + topCurveHeight) / 2, this.size / 2, topCurveHeight);
                    ctx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, topCurveHeight);
                    ctx.fill();
                } else {
                    // Draw Petal
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size / 2, this.size, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(Math.floor(window.innerWidth / 10), 50);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        /* --------------------------------------------------------------------------
         * AUDIO PLAYER CONTROLLER
         * -------------------------------------------------------------------------- */
        const audio = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const musicDisc = document.getElementById('musicDisc');
        const musicStatus = document.getElementById('musicStatus');
        let isPlaying = false;

        function toggleAudio(play) {
            if (play !== undefined) {
                isPlaying = !play;
            }
            if (isPlaying) {
                audio.pause();
                musicDisc.classList.remove('playing');
                musicStatus.innerText = "Tắt Nhạc";
                isPlaying = false;
            } else {
                audio.src = config.musicUrl;
                audio.play().then(() => {
                    musicDisc.classList.add('playing');
                    musicStatus.innerText = "Đang Phát";
                    isPlaying = true;
                }).catch(err => {
                    console.log("Autoplay blocked:", err);
                });
            }
        }

        musicBtn.addEventListener('click', () => toggleAudio());

        /* --------------------------------------------------------------------------
         * TYPING EFFECT (SCREEN 1)
         * -------------------------------------------------------------------------- */
        function startTypingEffect(text) {
            const container = document.getElementById('typingText');
            container.innerHTML = "";
            let i = 0;
            const timer = setInterval(() => {
                if (i < text.length) {
                    container.innerHTML += text.charAt(i);
                    i++;
                } else {
                    clearInterval(timer);
                }
            }, 70);
        }

        /* --------------------------------------------------------------------------
         * BOUQUET INTERACTION (SCREEN 2)
         * -------------------------------------------------------------------------- */
        const bouquetContainer = document.getElementById('bouquetContainer');
        const progressCircle = document.querySelector('.progress-ring__circle');
        const circumference = 2 * Math.PI * 130;
        let holdTimer = null;
        let holdProgress = 0;
        let photoIndex = 0;

        function triggerPhotoPopup(x, y) {
            const popup = document.createElement('div');
            popup.className = 'popup-photo';
            
            // Get current photo URL
            const photoUrl = config.memories[photoIndex % config.memories.length].img;
            photoIndex++;

            popup.innerHTML = `<img src="${photoUrl}" alt="Kỷ niệm">`;
            
            // Random position variation
            const randomRot = (Math.random() * 30 - 15) + 'deg';
            popup.style.setProperty('--rot', randomRot);
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;

            document.body.appendChild(popup);

            setTimeout(() => {
                popup.remove();
            }, 1800);
        }

        function setProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            progressCircle.style.strokeDashoffset = offset;
        }

        function startHold(e) {
            holdProgress = 0;
            const touch = e.touches ? e.touches[0] : e;
            const x = touch.clientX;
            const y = touch.clientY;

            // Spawn one immediate popup on tap
            triggerPhotoPopup(x, y);

            clearInterval(holdTimer);
            holdTimer = setInterval(() => {
                holdProgress += 4; // Fill speed
                setProgress(holdProgress);

                if (holdProgress >= 100) {
                    clearInterval(holdTimer);
                    // Switch to Screen 3
                    switchScreen('screen2', 'screen3');
                    initScreen3();
                }
            }, 50);
        }

        function endHold() {
            clearInterval(holdTimer);
            holdProgress = 0;
            setProgress(0);
        }

        // Event listeners for Click / Touch Hold
        bouquetContainer.addEventListener('mousedown', startHold);
        bouquetContainer.addEventListener('mouseup', endHold);
        bouquetContainer.addEventListener('mouseleave', endHold);

        bouquetContainer.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startHold(e);
        });
        bouquetContainer.addEventListener('touchend', endHold);

        /* --------------------------------------------------------------------------
         * LOVE DAYS COUNTER (SCREEN 3)
         * -------------------------------------------------------------------------- */
        function updateLoveCounter() {
            const start = new Date(config.startDate).getTime();
            const now = new Date().getTime();
            const diff = now - start;

            if (diff < 0) {
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = days < 10 ? '0' + days : days;
            document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
            document.getElementById('minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('seconds').innerText = seconds < 10 ? '0' + seconds : seconds;
        }

        function initScreen3() {
            // Update title
            document.getElementById('counterTitle').innerText = `Bên ${config.receiverName}`;
            
            // Start counter interval
            updateLoveCounter();
            setInterval(updateLoveCounter, 1000);

            // Populate Waterfall
            const container = document.getElementById('waterfallContainer');
            container.innerHTML = "";

            config.memories.forEach((mem, index) => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.innerHTML = `
                    <img src="${mem.img}" alt="Memory">
                    <p>${mem.text}</p>
                    <div class="card-date">${mem.date}</div>
                `;
                container.appendChild(card);

                // Reveal animation on scroll / load
                setTimeout(() => {
                    card.classList.add('visible');
                }, index * 300);
            });
        }

        /* --------------------------------------------------------------------------
         * SCREEN NAVIGATION
         * -------------------------------------------------------------------------- */
        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.remove('active');
            setTimeout(() => {
                document.getElementById(toId).classList.add('active');
            }, 300);
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            // Compliance with Audio Autoplay Policy
            toggleAudio(true);
            switchScreen('screen1', 'screen2');
        });

        /* --------------------------------------------------------------------------
         * CONFIGURATION MODAL & SHAREABLE LINK
         * -------------------------------------------------------------------------- */
        const configModal = document.getElementById('configModal');
        const openConfigBtn = document.getElementById('openConfigBtn');
        const btnCloseConfig = document.getElementById('btnCloseConfig');
        const btnSaveConfig = document.getElementById('btnSaveConfig');
        const btnCopyLink = document.getElementById('btnCopyLink');
        const toast = document.getElementById('toast');

        openConfigBtn.addEventListener('click', () => {
            document.getElementById('cfgReceiver').value = config.receiverName;
            document.getElementById('cfgIntroText').value = config.introMessage;
            document.getElementById('cfgStartDate').value = config.startDate;
            document.getElementById('cfgMusicUrl').value = config.musicUrl;
            configModal.classList.add('active');
        });

        btnCloseConfig.addEventListener('click', () => {
            configModal.classList.remove('active');
        });

        btnSaveConfig.addEventListener('click', () => {
            config.receiverName = document.getElementById('cfgReceiver').value || config.receiverName;
            config.introMessage = document.getElementById('cfgIntroText').value || config.introMessage;
            config.startDate = document.getElementById('cfgStartDate').value || config.startDate;
            config.musicUrl = document.getElementById('cfgMusicUrl').value || config.musicUrl;

            // Re-render UI
            startTypingEffect(config.introMessage);
            configModal.classList.remove('active');
            showToast("Đã cập nhật thay đổi!");
        });

        btnCopyLink.addEventListener('click', () => {
            const dataToEncode = {
                receiverName: document.getElementById('cfgReceiver').value,
                introMessage: document.getElementById('cfgIntroText').value,
                startDate: document.getElementById('cfgStartDate').value,
                musicUrl: document.getElementById('cfgMusicUrl').value
            };

            const encoded = btoa(encodeURIComponent(JSON.stringify(dataToEncode)));
            const shareableUrl = `${window.location.origin}${window.location.pathname}?data=${encoded}`;

            // Copy to Clipboard
            const dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = shareableUrl;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            showToast("Đã sao chép đường dẫn chia sẻ!");
        });

        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        /* --------------------------------------------------------------------------
         * INITIALIZATION
         * -------------------------------------------------------------------------- */
        window.onload = function () {
            loadConfigFromUrl();
            initParticles();
            animateParticles();
            startTypingEffect(config.introMessage);
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Tailwind CSS for Quick Utility Styling & Reset -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --primary-rose: #c9184a;
            --dark-rose: #800f2f;
            --light-pink: #ffccd5;
            --bg-pink: #fff0f3;
            --gold-accent: #d4af37;
            --rose-gradient: linear-gradient(135deg, #ff4d6d, #c9184a, #800f2f);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 50%, #ffb3c1 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .font-serif-custom {
            font-family: 'Playfair Display', serif;
        }

        .font-cursive {
            font-family: 'Dancing Script', cursive;
        }

        /* Canvas Background for Petals */
        #petalCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Glowing Button Effects */
        .btn-glow {
            background: var(--rose-gradient);
            box-shadow: 0 0 15px rgba(201, 24, 74, 0.35);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .btn-glow::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(45deg) translateY(-100%);
            transition: transform 0.6s ease;
        }

        .btn-glow:hover::before {
            transform: rotate(45deg) translateY(100%);
        }

        .btn-glow:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 20px rgba(201, 24, 74, 0.5);
        }

        .btn-glow:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Minimal & Clean Card Frame */
        .card-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 35px rgba(128, 15, 47, 0.08), 0 5px 15px rgba(0, 0, 0, 0.03);
            border-radius: 20px;
        }

        /* Subtle Avatar Border */
        .avatar-frame {
            position: relative;
            padding: 3px;
            background: linear-gradient(135deg, #e0a96d, #f8e1b4, #c59b27);
            border-radius: 50%;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        }

        /* Animation States */
        #scatterOverlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            display: none;
        }

        .mini-card-proxy {
            position: absolute;
            width: 110px;
            height: 150px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            background-size: cover;
            background-position: center;
            opacity: 0.9;
        }

        @keyframes popupBounce {
            0% {
                opacity: 0;
                transform: scale(0.85) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .animate-card-bounce {
            animation: popupBounce 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(255, 204, 213, 0.2);
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #f472b6;
            border-radius: 10px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between items-center px-4 py-6 text-gray-800">

    <!-- Petal & Sparkle Canvas Layer -->
    <canvas id="petalCanvas"></canvas>

    <!-- Main Content Wrapper -->
    <div class="w-full max-w-3xl mx-auto z-10 flex flex-col items-center flex-grow justify-center my-auto">
        
        <!-- Header Banner -->
        <header class="text-center mb-6 sm:mb-8">
            <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-white/80 border border-pink-200 text-rose-700 text-xs sm:text-sm font-semibold mb-3 backdrop-blur-md shadow-sm">
                <i class="fa-solid fa-heart text-rose-500 text-xs"></i>

            </div>

        </header>

        <!-- Dynamic Greeting Card Container Area -->
        <main class="w-full relative min-h-[380px] flex items-center justify-center">

            <!-- Card Outer Wrapper -->
            <div id="cardWrapper" class="w-full hidden">
                <div class="card-container p-6 sm:p-8 md:p-9">
                    <div class="flex flex-col md:flex-row items-center gap-6 md:gap-8">
                        
                        <!-- Left: Wish Content -->
                        <div class="flex-1 text-center md:text-left order-2 md:order-1 flex flex-col justify-between">
                            <div>
                                <!-- Tag/Role Badge -->
                                <div class="flex items-center justify-center md:justify-start gap-2 mb-2">
                                    <span id="cardRole" class="px-2.5 py-0.5 rounded-md text-xs font-semibold tracking-wide bg-rose-50 text-rose-700 border border-rose-200/60">
                                        abc
                                    </span>
                                </div>

                                <!-- Recipient Name -->
                                <h2 id="cardTitle" class="text-2xl sm:text-3xl font-bold font-serif-custom text-gray-900 mb-3 tracking-wide">
                                    xyz
                                </h2>

                                <!-- Main Wish Title / Quote -->
                                <p id="cardWish" class="text-base sm:text-lg font-medium text-rose-700 mb-3 leading-relaxed font-serif-custom italic">
                                    "123
                                </p>

                                <!-- Bio / Sentimental Sentences -->
                                <div class="custom-scroll max-h-32 overflow-y-auto pr-1">
                                    <p id="cardDesc" class="text-sm text-gray-600 leading-relaxed font-normal">
                                        12345
                                    </p>
                                </div>
                            </div>

                            <!-- Subtle Footnote -->
                            <div class="mt-5 pt-3 border-t border-gray-100 flex items-center justify-between text-xs text-gray-400">
                                <span></span>
                                <span class="font-cursive text-base text-rose-500 font-semibold"></span>
                            </div>
                        </div>

                        <!-- Right: Avatar Image -->
                        <div class="w-full md:w-4/12 flex flex-col items-center justify-center order-1 md:order-2">
                            <div class="avatar-frame w-36 h-36 sm:w-44 sm:h-44 md:w-48 md:h-48 relative">
                                <img id="cardImage" src="https://images.unsplash.com/photo-1518895949257-7621c3c786d7?q=80&w=600&auto=format&fit=crop" 
                                     alt="Hình ảnh 20/10" 
                                     class="w-full h-full object-cover rounded-full border border-white"
                                     onerror="this.src='https://images.unsplash.com/photo-1563241527-3004b7be0ffd?q=80&w=600&auto=format&fit=crop'">
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Completion View (Shown when all cards are viewed) -->
            <div id="completionBox" class="w-full max-w-md hidden text-center p-8 bg-white/95 backdrop-blur-md rounded-2xl border border-pink-200 shadow-xl relative z-20">
                <div class="w-16 h-16 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fa-solid fa-sparkles"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-900 font-serif-custom mb-2">Đã Khám Phá Hết! 🌸</h3>
                <p class="text-gray-600 text-sm mb-6">
                    Bạn đã khám phá trọn bộ 12 danh thiếp chúc mừng Ngày Phụ Nữ Việt Nam 20/10 với những lời chúc ý nghĩa nhất.
                </p>
                <button id="btnReset" class="w-full py-3 px-6 rounded-full font-semibold text-white btn-glow flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>Xem Lại Từ Đầu</span>
                </button>
            </div>

        </main>

        <!-- Action Controls & Progress Bar -->
        <footer class="mt-8 flex flex-col items-center gap-4 w-full z-10">
            
            <!-- Progress Counter -->
            <div class="flex items-center gap-3 bg-white/80 backdrop-blur-md px-4 py-1.5 rounded-full border border-pink-100 shadow-sm text-xs font-medium text-gray-600">
                <span>Tiến trình: <strong id="progressText" class="text-rose-600 font-bold">1 / 12</strong></span>
                <div class="w-24 bg-gray-100 h-1.5 rounded-full overflow-hidden">
                    <div id="progressBar" class="bg-rose-500 h-full w-0 transition-all duration-500"></div>
                </div>
            </div>

            <!-- Main Interactive Button -->
            <button id="btnNext" class="py-3.5 px-8 rounded-full font-semibold text-white text-base btn-glow flex items-center gap-2.5 shadow-lg">
                <span id="btnText">Tiếp Theo</span>
                <i class="fa-solid fa-arrow-right text-sm"></i>
            </button>

        </footer>

    </div>


    <!-- JavaScript Logic -->
    <script>
        // ------------------------------------------------------------------
        // 1. DATA MODEL: 12 Distinct Greeting Cards
        // ------------------------------------------------------------------
        const cardsData = [
            {
                id: 1,
                role: "...",
                title: "...",
                wish: "...",
                desc: "...",
                image: "anh"
            },
            {
                id: 2,
                role: "...",
                title: "...",
                wish: "...",
                desc: "...",
                image: "anh"
            },
            {
               id: 3,
                role: "...",
                title: "...",
                wish: "...",
                desc: "...",
                image: "anh"
            },
            {
                id: 4,
                role: "...",
                title: "...",
                wish: "...",
                desc: "...",
                image: "anh"
            },
            {
                id: 5,
                role: "...",
                title: "...",
                wish: "...",
                desc: "...",
                image: "anh"
            },
            {
                id: 6,
                role: "...",
                title: "...",
                wish: "...",
                desc: "...",
                image: "anh"
            },
            {
                id: 7,
                role: "...",
                title: "...",
                wish: "...",
                desc: "...",
                image: "anh"
            },
            {
                id: 8,
                role: "...",
                title: "...",
                wish: "...",
                desc: "...",
                image: "anh"
            },
            {
               id: 9,
                role: "...",
                title: "...",
                wish: "...",
                desc: "...",
                image: "anh"
            },
            {
                id: 10,
                role: "...",
                title: "...",
                wish: "...",
                desc: "...",
                image: "anh"
            },
            {
               id: 11,
                role: "...",
                title: "...",
                wish: "...",
                desc: "...",
                image: "anh"
            },
            {
                id: 12,
                role: "...",
                title: "...",
                wish: "...",
                desc: "...",
                image: "anh"
            }
        ];

        // State variables
        let availableIds = [];
        let isAnimating = false;

        // ------------------------------------------------------------------
        // 2. DOM ELEMENTS
        // ------------------------------------------------------------------
        const cardWrapper = document.getElementById('cardWrapper');
        const cardRole = document.getElementById('cardRole');
        const cardTitle = document.getElementById('cardTitle');
        const cardWish = document.getElementById('cardWish');
        const cardDesc = document.getElementById('cardDesc');
        const cardImage = document.getElementById('cardImage');

        const btnNext = document.getElementById('btnNext');
        const btnText = document.getElementById('btnText');
        const btnReset = document.getElementById('btnReset');
        const completionBox = document.getElementById('completionBox');

        const progressText = document.getElementById('progressText');
        const progressBar = document.getElementById('progressBar');
        const scatterOverlay = document.getElementById('scatterOverlay');

        // ------------------------------------------------------------------
        // 3. CANVAS PETALS & SPARKLES ANIMATION
        // ------------------------------------------------------------------
        const canvas = document.getElementById('petalCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class Petal {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * -height;
                this.size = Math.random() * 10 + 6;
                this.speedY = Math.random() * 1.2 + 0.6;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 1.5;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.color = Math.random() > 0.3 ? '#ffccd5' : '#ff4d6d';
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.01) + this.speedX;
                this.rotation += this.rotationSpeed;

                if (this.y > height + 20) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-this.size / 2, -this.size / 2, -this.size, this.size / 3, 0, this.size);
                ctx.bezierCurveTo(this.size, this.size / 3, this.size / 2, -this.size / 2, 0, 0);
                ctx.fill();
                ctx.restore();
            }
        }

        const petals = Array.from({ length: 30 }, () => new Petal());

        function animatePetals() {
            ctx.clearRect(0, 0, width, height);
            petals.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animatePetals);
        }
        animatePetals();

        // ------------------------------------------------------------------
        // 4. RANDOM & SCATTER ANIMATION LOGIC
        // ------------------------------------------------------------------
        function initApp() {
            availableIds = cardsData.map(c => c.id);
            completionBox.classList.add('hidden');
            btnNext.disabled = false;
            btnNext.style.opacity = '1';
            btnText.textContent = "Xem Danh Thiếp Tiếp Theo";
            showNextCard();
        }

        function triggerScatterAnimation(callback) {
            scatterOverlay.style.display = 'block';
            scatterOverlay.innerHTML = '';

            const proxyCount = 12;
            const proxies = [];

            for (let i = 0; i < proxyCount; i++) {
                const proxy = document.createElement('div');
                proxy.className = 'mini-card-proxy';

                const randomCard = cardsData[Math.floor(Math.random() * cardsData.length)];
                proxy.style.backgroundImage = `url('${randomCard.image}')`;

                const startX = window.innerWidth / 2 - 55;
                const startY = window.innerHeight / 2 - 75;

                proxy.style.left = `${startX}px`;
                proxy.style.top = `${startY}px`;

                scatterOverlay.appendChild(proxy);
                proxies.push(proxy);
            }

            const startTime = performance.now();
            const duration = 1400; // 1.4 seconds

            function animateProxies(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);

                proxies.forEach((p, idx) => {
                    const angle = (idx / proxyCount) * Math.PI * 2 + progress * 6;
                    const radius = (1 - Math.pow(progress - 1, 2)) * (Math.min(window.innerWidth, window.innerHeight) * 0.35);

                    const x = (window.innerWidth / 2 - 55) + Math.cos(angle) * radius * (1 + Math.sin(idx));
                    const y = (window.innerHeight / 2 - 75) + Math.sin(angle) * radius * (1 + Math.cos(idx));
                    const rot = progress * 540 + idx * 30;
                    const scale = 0.6 + Math.sin(progress * Math.PI + idx) * 0.4;

                    p.style.transform = `translate3d(${x - (window.innerWidth / 2 - 55)}px, ${y - (window.innerHeight / 2 - 75)}px, 0) rotate(${rot}deg) scale(${scale})`;
                    p.style.opacity = (1 - progress * 0.9).toString();
                });

                if (progress < 1) {
                    requestAnimationFrame(animateProxies);
                } else {
                    scatterOverlay.style.display = 'none';
                    scatterOverlay.innerHTML = '';
                    if (callback) callback();
                }
            }

            requestAnimationFrame(animateProxies);
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 50,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff4d6d', '#c9184a', '#d4af37', '#ffffff']
                });
            }
        }

        function updateCardUI(card) {
            cardRole.textContent = card.role;
            cardTitle.textContent = card.title;
            cardWish.textContent = `"${card.wish}"`;
            cardDesc.textContent = card.desc;
            cardImage.src = card.image;

            cardWrapper.classList.remove('hidden', 'animate-card-bounce');
            void cardWrapper.offsetWidth;
            cardWrapper.classList.add('animate-card-bounce');

            const total = cardsData.length;
            const viewedCount = total - availableIds.length;
            progressText.textContent = `${viewedCount} / ${total}`;
            progressBar.style.width = `${(viewedCount / total) * 100}%`;
        }

        function showNextCard() {
            if (isAnimating) return;

            if (availableIds.length === 0) {
                cardWrapper.classList.add('hidden');
                completionBox.classList.remove('hidden');
                btnNext.disabled = true;
                btnNext.style.opacity = '0.5';
                btnText.textContent = "Đã Xem Hết Thiếp";
                return;
            }

            isAnimating = true;

            if (availableIds.length === cardsData.length) {
                const randomIndex = Math.floor(Math.random() * availableIds.length);
                const chosenId = availableIds.splice(randomIndex, 1)[0];
                const card = cardsData.find(c => c.id === chosenId);

                updateCardUI(card);
                triggerConfetti();
                isAnimating = false;
            } else {
                cardWrapper.classList.add('hidden');

                triggerScatterAnimation(() => {
                    const randomIndex = Math.floor(Math.random() * availableIds.length);
                    const chosenId = availableIds.splice(randomIndex, 1)[0];
                    const card = cardsData.find(c => c.id === chosenId);

                    updateCardUI(card);
                    triggerConfetti();
                    isAnimating = false;

                    if (availableIds.length === 0) {
                        btnText.textContent = "Xem Thiếp Cuối Cùng";
                    } else {
                        btnText.textContent = "Xem Danh Thiếp Tiếp Theo";
                    }
                });
            }
        }

        // ------------------------------------------------------------------
        // 5. EVENT LISTENERS
        // ------------------------------------------------------------------
        btnNext.addEventListener('click', showNextCard);
        btnReset.addEventListener('click', initApp);

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>

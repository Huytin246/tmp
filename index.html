<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Món Quà Tình Yêu - Dành Tặng Người Tôi Yêu</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        :root {
            --primary-pink: #ff758c;
            --deep-red: #ff7eb3;
            --velvet-red: #d63447;
            --soft-white: #fff5f6;
            --gold-accent: #f7d070;
            --font-serif: 'Dancing Script', cursive;
            --font-sans: 'Montserrat', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-sans);
            background: linear-gradient(135deg, #2b1055, #7597de);
            color: #fff;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
        }

        /* MUSIC PLAYER */
        .music-player {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 8px 16px 8px 8px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .music-disc {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, #111, #333);
            border: 2px solid var(--gold-accent);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotateDisc 4s linear infinite;
            animation-play-state: paused;
        }

        .music-disc.playing {
            animation-play-state: running;
        }

        .music-disc i {
            color: var(--gold-accent);
            font-size: 16px;
        }

        @keyframes rotateDisc {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .music-info {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* CONFIG BUTTON */
        .config-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .config-btn:hover {
            transform: rotate(45deg) scale(1.1);
        }

        /* SCREEN 1: INTRO */
        #screen1 {
            background: linear-gradient(135deg, rgba(255, 117, 140, 0.8), rgba(255, 126, 179, 0.8));
            text-align: center;
        }

        .intro-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .avatar-box {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(45deg, var(--gold-accent), #fff);
            box-shadow: 0 8px 20px rgba(214, 52, 71, 0.4);
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .typing-text {
            font-family: var(--font-serif);
            font-size: 2rem;
            color: #fff;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            line-height: 1.3;
        }

        .btn-heartbeat {
            padding: 16px 36px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #d63447;
            background: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: heartbeat 1.5s infinite;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .btn-heartbeat:hover {
            transform: scale(1.05);
            background: #fff5f6;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }

        /* SCREEN 2: BOUQUET */
        #screen2 {
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            text-align: center;
        }

        .bouquet-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .bouquet-svg {
            width: 260px;
            height: 320px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.2));
            transition: transform 0.2s ease;
        }

        .bouquet-wrapper:active .bouquet-svg {
            transform: scale(0.96);
        }

        .hold-instruction {
            margin-top: 25px;
            font-size: 1rem;
            color: #6a1b29;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .progress-ring-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            width: 300px;
            height: 300px;
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            stroke-dasharray: 816;
            stroke-dashoffset: 816;
        }

        .popup-photo {
            position: fixed;
            width: 110px;
            height: 140px;
            background: #fff;
            padding: 8px 8px 25px 8px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            pointer-events: none;
            animation: popupFloat 1.8s ease-out forwards;
            z-index: 50;
        }

        .popup-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        @keyframes popupFloat {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(0deg); }
            30% { opacity: 1; transform: translate(-50%, -120px) scale(1) rotate(var(--rot)); }
            100% { opacity: 0; transform: translate(-50%, -200px) scale(0.8) rotate(var(--rot)); }
        }

        /* SCREEN 3: MEMORIES & COUNTER */
        #screen3 {
            background: linear-gradient(135deg, #2b0826, #591d3e, #1a0826);
            overflow-y: auto;
            justify-content: flex-start;
            padding-top: 80px;
            padding-bottom: 40px;
        }

        .timer-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            width: 90%;
            max-width: 500px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .timer-title {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--gold-accent);
            margin-bottom: 12px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .timer-unit {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 5px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .timer-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            display: block;
        }

        .timer-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .waterfall-container {
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .memory-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .memory-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .memory-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .memory-card p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #fff;
            font-weight: 300;
        }

        .memory-card .card-date {
            font-size: 0.75rem;
            color: var(--gold-accent);
            margin-top: 8px;
            text-align: right;
            font-weight: 600;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-body {
            background: #2b1055;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .modal-body h3 {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--gold-accent);
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: rgba(255,255,255,0.8);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-modal {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save { background: var(--primary-pink); color: #fff; }
        .btn-close { background: rgba(255,255,255,0.2); color: #fff; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.9rem;
            z-index: 300;
            transition: transform 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>
    
    <!-- Audio ẩn phát nhạc -->
    <audio id="bgMusic" loop></audio>

    <div class="music-player" id="musicBtn">
        <div class="music-disc" id="musicDisc">
            <i class="fa-solid fa-music"></i>
        </div>
        <span class="music-info" id="musicStatus">Nhạc Nền</span>
    </div>

    <div class="config-btn" id="openConfigBtn" title="Cấu hình">
        <i class="fa-solid fa-gear"></i>
    </div>

    <div class="app-container">
        <!-- SCREEN 1 -->
        <section class="screen active" id="screen1">
            <div class="intro-card">
                <div class="avatar-box">
                    <img id="introAvatar" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400&auto=format&fit=crop&q=80" alt="Avatar">
                </div>
                <div class="typing-text" id="typingText"></div>
                <button class="btn-heartbeat" id="startBtn">
                    <i class="fa-solid fa-heart"></i> Mở Món Quà
                </button>
            </div>
        </section>

        <!-- SCREEN 2 -->
        <section class="screen" id="screen2">
            <div class="bouquet-wrapper" id="bouquetContainer">
                <svg class="bouquet-svg" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M60 160 L100 230 L140 160 Q100 180 60 160 Z" fill="#ff758c" />
                    <path d="M50 120 Q100 150 150 120 L135 170 Q100 185 65 170 Z" fill="#ff7eb3" opacity="0.9" />
                    <circle cx="100" cy="80" r="30" fill="#d63447" />
                    <circle cx="100" cy="80" r="22" fill="#ff2e63" />
                    <circle cx="65" cy="100" r="25" fill="#e84545" />
                    <circle cx="135" cy="100" r="25" fill="#e84545" />
                    <circle cx="75" cy="60" r="22" fill="#ff2e63" />
                    <circle cx="125" cy="60" r="22" fill="#ff2e63" />
                </svg>
                <div class="progress-ring-container">
                    <svg width="300" height="300">
                        <circle class="progress-ring__circle" stroke="#f7d070" stroke-width="6" fill="transparent" r="130" cx="150" cy="150"/>
                    </svg>
                </div>
                <div class="hold-instruction">
                    <i class="fa-solid fa-hand-pointer"></i> Chạm để bắn ảnh hoặc <b>Ấn & Giữ</b> để tiếp tục
                </div>
            </div>
        </section>

        <!-- SCREEN 3 -->
        <section class="screen" id="screen3">
            <div class="timer-card" id="timerCard">
                <div class="timer-title" id="timerTitle">Thời Gian Bên Nhau</div>
                <div class="timer-grid">
                    <div class="timer-unit"><span class="timer-number" id="daysCount">0</span><span class="timer-label">Ngày</span></div>
                    <div class="timer-unit"><span class="timer-number" id="hoursCount">0</span><span class="timer-label">Giờ</span></div>
                    <div class="timer-unit"><span class="timer-number" id="minsCount">0</span><span class="timer-label">Phút</span></div>
                    <div class="timer-unit"><span class="timer-number" id="secsCount">0</span><span class="timer-label">Giây</span></div>
                </div>
            </div>
            <div class="waterfall-container" id="waterfallContainer"></div>
        </section>
    </div>
>

    <script>
        const DEFAULT_CONFIG = {
            introMessage: "Gửi Bạn xuu - bông hoa đẹp nhất ❤️",
            startDate: "2024-01-01T00:00:00",
            musicUrl: "https://www.bensound.com/bensound-music/bensound-tenderness.mp3",
            avatarUrl: "https://drive.google.com/file/d/18MZaU_pcrQB5Q4JEcFq4KIyWCozQa-T0/view?usp=sharing",
            memories: [
                { img: "https://drive.google.com/file/d/1cxPPffAHF4AKWlQ1XFxrp9bryfWV7Fi7/view?usp=sharing", text: "20 tháng 10 Khoa chúc xuu một ngày tràn ngập niềm vui vô lo vô nghĩ!", date: "20/10/2026" },
                { img: "https://drive.google.com/file/d/1-eQMN-qoSWGlnZhcolCWNJIf5dtQ5fmG/view?usp=sharing", text: "Chúc xuu luôn xinh đẹp rạng rỡ như những ánh nắng ban mai.", date: "Mỗi ngày" },
                { img: "https://drive.google.com/file/d/1h5WdTan6OGFsh6ycDbCtRNiW0rQ2nyGR/view?usp=sharing", text: "Và mong những điều tốt sẽ tìm đến bạn,hôm nay,ngày mai và cả những ngày sau nữa. Thương, Khoa đẹp zoai", date: "Luôn luôn" }
            ]
        };

        let config = { ...DEFAULT_CONFIG };

        // Canvas Particles
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 20;
                this.size = Math.random() * 10 + 6;
                this.speedY = Math.random() * 1.2 + 0.4;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.opacity = Math.random() * 0.7 + 0.3;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.02;
                this.color = ['#ff758c', '#ff7eb3', '#d63447', '#f7d070'][Math.floor(Math.random() * 4)];
            }
            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.y * 0.01) + this.speedX;
                this.rotation += this.rotSpeed;
                if (this.y < -30) this.reset();
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 40; i++) particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();

        // Audio & Screen Switching
        const audio = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const musicDisc = document.getElementById('musicDisc');
        const musicStatus = document.getElementById('musicStatus');
        let isPlaying = false;

        function toggleAudio() {
            if (isPlaying) {
                audio.pause();
                musicDisc.classList.remove('playing');
                musicStatus.innerText = "Tắt Nhạc";
                isPlaying = false;
            } else {
                audio.src = config.musicUrl;
                audio.play().then(() => {
                    musicDisc.classList.add('playing');
                    musicStatus.innerText = "Đang Phát";
                    isPlaying = true;
                }).catch(e => console.log(e));
            }
        }
        musicBtn.addEventListener('click', toggleAudio);

        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.remove('active');
            document.getElementById(toId).classList.add('active');
        }

        // Typing Effect
        function startTypingEffect(text) {
            const container = document.getElementById('typingText');
            container.innerHTML = "";
            let i = 0;
            const timer = setInterval(() => {
                if (i < text.length) {
                    container.innerHTML += text.charAt(i);
                    i++;
                } else {
                    clearInterval(timer);
                }
            }, 60);
        }
        startTypingEffect(config.introMessage);

        document.getElementById('startBtn').addEventListener('click', () => {
            if (!isPlaying) toggleAudio();
            switchScreen('screen1', 'screen2');
        });

        // Bouquet Interactions
        const bouquetContainer = document.getElementById('bouquetContainer');
        const progressCircle = document.querySelector('.progress-ring__circle');
        const circumference = 2 * Math.PI * 130;
        let holdTimer = null;
        let holdProgress = 0;
        let photoIndex = 0;

        function triggerPhotoPopup(x, y) {
            const popup = document.createElement('div');
            popup.className = 'popup-photo';
            const photoUrl = config.memories[photoIndex % config.memories.length].img;
            photoIndex++;
            popup.innerHTML = `<img src="${photoUrl}" alt="Kỷ niệm">`;
            popup.style.setProperty('--rot', (Math.random() * 30 - 15) + 'deg');
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 1800);
        }

        function setProgress(percent) {
            progressCircle.style.strokeDashoffset = circumference - (percent / 100) * circumference;
        }

        function startHold(e) {
            holdProgress = 0;
            const touch = e.touches ? e.touches[0] : e;
            triggerPhotoPopup(touch.clientX, touch.clientY);

            clearInterval(holdTimer);
            holdTimer = setInterval(() => {
                holdProgress += 5;
                setProgress(holdProgress);
                if (holdProgress >= 100) {
                    clearInterval(holdTimer);
                    switchScreen('screen2', 'screen3');
                    initScreen3();
                }
            }, 50);
        }

        function endHold() {
            clearInterval(holdTimer);
            holdProgress = 0;
            setProgress(0);
        }

        bouquetContainer.addEventListener('mousedown', startHold);
        bouquetContainer.addEventListener('mouseup', endHold);
        bouquetContainer.addEventListener('mouseleave', endHold);
        bouquetContainer.addEventListener('touchstart', (e) => { e.preventDefault(); startHold(e); });
        bouquetContainer.addEventListener('touchend', endHold);

        // Screen 3 Initialization
        function initScreen3() {
            // Love Counter Timer
            setInterval(() => {
                const start = new Date(config.startDate);
                const now = new Date();
                const diff = now - start;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const mins = Math.floor((diff / 1000 / 60) % 60);
                const secs = Math.floor((diff / 1000) % 60);

                document.getElementById('daysCount').innerText = days >= 0 ? days : 0;
                document.getElementById('hoursCount').innerText = hours;
                document.getElementById('minsCount').innerText = mins;
                document.getElementById('secsCount').innerText = secs;
            }, 1000);

            // Populate Waterfall Memories
            const container = document.getElementById('waterfallContainer');
            container.innerHTML = "";
            config.memories.forEach((mem, index) => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.innerHTML = `
                    <img src="${mem.img}" alt="Memory">
                    <p>${mem.text}</p>
                    <div class="card-date">${mem.date}</div>
                `;
                container.appendChild(card);
                setTimeout(() => card.classList.add('visible'), 300 * (index + 1));
            });
        }

        // Modal Config Logic
        const modal = document.getElementById('configModal');
        document.getElementById('openConfigBtn').addEventListener('click', () => modal.classList.add('active'));
        document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.remove('active'));

        document.getElementById('saveConfigBtn').addEventListener('click', () => {
            config.introMessage = document.getElementById('inputIntroMsg').value;
            config.startDate = document.getElementById('inputStartDate').value;
            config.musicUrl = document.getElementById('inputMusicUrl').value;
            
            startTypingEffect(config.introMessage);
            modal.classList.remove('active');
            
            const toast = document.getElementById('toastMessage');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        });
    </script>
</body>
</html>
